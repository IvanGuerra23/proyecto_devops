# Configuración de Prometheus para el entorno de Compose.
# Se activa con: docker compose --profile observability up -d

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "crud-docker-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:5000"]
        labels:
          service: "crud-docker-app"
          environment: "local"
