name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: pytest -q

  docker:
    name: Build, escaneo y publicación
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Normalizar nombre de imagen
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen
        run: |
          docker build \
            --tag "$IMAGE_NAME:sha-${GITHUB_SHA}" \
            --tag "$IMAGE_NAME:latest" .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Publicar en GHCR
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_NAME:sha-${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"
